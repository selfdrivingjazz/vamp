[project]
name = "vamp-models"
version = "0.1.0"
description = "Optional local model processors for VAMP (Florence-2 captions/tags, SigLIP embeddings)"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.1",
    "Pillow>=11,<12",
    "huggingface-hub>=0.34,<1",
    "safetensors>=0.5,<0.7",
    "sentencepiece==0.2.1",
    "protobuf>=5,<7",
    "numpy>=2,<3",
]

[tool.uv]
package = false
