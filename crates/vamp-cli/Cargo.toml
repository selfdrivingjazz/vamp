[package]
name = "vamp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vamp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
vamp-core = { workspace = true, features = ["native"] }
vamp-protocol.workspace = true
tiny_http = "0.12"
base64 = "0.22"
# HTTP client: opt-in diagnostics reports (`vamp diagnostics`) and `vamp self-update`.
ureq = "3"
# `vamp self-update` (with `remote`): release checksum, .tar.gz reader.
sha2 = { version = "0.11", optional = true }
flate2 = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# `vamp contexts remote`, `vamp sync` and `vamp self-update`.
remote = ["vamp-core/remote", "dep:sha2", "dep:flate2"]
