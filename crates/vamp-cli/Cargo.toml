[package]
name = "vamp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vamp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
vamp-core.workspace = true
vamp-protocol.workspace = true
# `vamp self-update` (with `remote`): HTTP client, release checksum, .tar.gz reader.
ureq = { version = "3", optional = true }
sha2 = { version = "0.11", optional = true }
flate2 = { version = "1", optional = true }

[features]
default = []
# `vamp contexts remote`, `vamp sync` and `vamp self-update` (adds an HTTP client).
remote = ["vamp-core/remote", "dep:ureq", "dep:sha2", "dep:flate2"]
