[package]
name = "vamp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vamp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
vamp-core = { workspace = true, features = ["native"] }
vamp-protocol.workspace = true
tiny_http = "0.12"
base64 = "0.22"
chrono.workspace = true
# `vamp setup install` times its processors on a generated JPEG (already built for vamp-core).
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# HTTP client: opt-in diagnostics reports (`vamp diagnostics`), `vamp self-update` and the uv
# download of `vamp setup install`.
ureq = "3"
# `vamp self-update` and the uv download of `vamp setup install` (with `remote`): release
# checksum, .tar.gz reader.
sha2 = { version = "0.11", optional = true }
flate2 = { version = "1", optional = true }
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"], optional = true }
ctrlc = { version = "3.5", features = ["termination"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# `vamp contexts remote`, `vamp sync`, `vamp self-update` and the uv download of `vamp setup install`.
remote = ["vamp-core/remote", "dep:sha2", "dep:flate2", "dep:tungstenite", "dep:ctrlc"]
