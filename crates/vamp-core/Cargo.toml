[package]
name = "vamp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
native = ["dep:zip"]
# HTTP client for replica contexts of a vamp-server authority.
remote = ["dep:ureq", "dep:sha2"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
blake3.workspace = true
rusqlite.workspace = true
vamp-protocol.workspace = true
fs2 = "0.4"
libc = "0.2"
base64 = "0.22"
zip = { version = "2", default-features = false, optional = true }
ureq = { version = "3", features = ["json", "gzip"], optional = true }
# Share blob ids (`sha256:`), verified natively by share hosts.
sha2 = { version = "0.11", optional = true }

image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
webp = { version = "0.3.1", default-features = false }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
