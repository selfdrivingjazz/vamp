[workspace]
members = [
    "crates/vamp-protocol",
    "crates/vamp-core",
    "crates/vamp-cli",
    "crates/vamp-media",
    "crates/vamp-server",
    "crates/vamp-store",
]
default-members = ["crates/vamp-cli"]
resolver = "2"
# Patched third-party crates (see vendor/*/VENDORED.md); not workspace members.
exclude = ["vendor"]

[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
blake3 = "1"
rusqlite = { version = "0.39", features = ["bundled", "functions"] }
clap = { version = "4", features = ["derive", "env"] }
vamp-protocol = { version = "0.4.1", path = "crates/vamp-protocol" }
vamp-core = { version = "0.4.1", path = "crates/vamp-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
